name: Publish VLFLib to NuGet.org

on:
  push:
    branches: [ master ]
    paths:
      - 'tools/VLFLib/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      BASE_VERSION: 0.1
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Compute version
      id: ver
      run: |
        # 2-digit year + month + day (6 digits, e.g. 250708)
        DATE=$(date -u +'%y%m%d')
        RUN=${{ github.run_number }}
        # zero-pad run to 3 digits so sorting still works
        PATCH="${DATE}$(printf '%03d' \"$RUN\")"
        echo "VERSION=${BASE_VERSION}.${PATCH}" >> "$GITHUB_ENV"

    # --------- restore, build, pack -----------------------------------
    - name: Restore
      working-directory: tools/VLFLib
      run: dotnet restore

    - name: Build
      working-directory: tools/VLFLib
      run: dotnet build -c Release --no-restore

    - name: Pack
      working-directory: tools/VLFLib
      run: |
        dotnet pack -c Release \
                    /p:PackageVersion=$VERSION \
                    -o ../../nupkg \
                    --no-build

    # --------- publish to NuGet.org ----------------------------------
    - name: Push to NuGet.org
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --api-key  "$NUGET_API_KEY" \
          --source   "https://api.nuget.org/v3/index.json" \
          --skip-duplicate \
          --no-symbols